name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile
        working-directory: proj3/gitlet
        run: javac -g -Xlint:unchecked -Xlint:deprecation -cp ".." *.java

      - name: Run unit tests
        working-directory: proj3
        run: java -ea -cp "." gitlet.UnitTest
